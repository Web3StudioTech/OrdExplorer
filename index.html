<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ord.xyz &mdash; Bitcoin Ordinals Explorer</title>
<meta name="description" content="Bitcoin Ordinals Explorer — Browse inscriptions, collections, blocks, runes and more. Powered by ordinals.com.">
<style>
/* ── RESET & BASE ─────────────────────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#070b10;color:#d8e0ea;font-family:'Inter',system-ui,-apple-system,sans-serif;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input{font-family:inherit}
iframe{border:none;display:block}
img{display:block;max-width:100%}

/* ── ANIMATIONS ───────────────────────────────────────────────────────────── */
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 8px rgba(247,147,26,.3)}50%{box-shadow:0 0 20px rgba(247,147,26,.6)}}

/* ── UTILITY ──────────────────────────────────────────────────────────────── */
.sk{background:linear-gradient(90deg,#0d1520 25%,#1a2535 50%,#0d1520 75%);background-size:200% 100%;animation:shimmer 1.5s ease-in-out infinite;border-radius:6px}
.fade{animation:fadeUp .28s ease both}
.spin{animation:spin .8s linear infinite;display:inline-block}
.pulse{animation:pulse 2s ease-in-out infinite}

/* ── SCROLLBAR ────────────────────────────────────────────────────────────── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#070b10}
::-webkit-scrollbar-thumb{background:#1a2535;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#243040}

/* ── NAV ──────────────────────────────────────────────────────────────────── */
#nav{
  position:sticky;top:0;z-index:100;
  height:54px;padding:0 20px;
  background:rgba(7,11,16,.97);
  border-bottom:1px solid #141f2e;
  display:flex;align-items:center;gap:0;
  backdrop-filter:blur(12px);
}
#logo{
  display:flex;align-items:center;gap:9px;
  cursor:pointer;margin-right:24px;flex-shrink:0;
}
#logo-icon{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,#f7931a,#d4750e);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900;color:#000;
  box-shadow:0 2px 12px rgba(247,147,26,.35);
}
#logo-text{font-size:16px;font-weight:800;color:#f7931a;letter-spacing:-.4px}
#nav-links{display:flex;align-items:center;gap:2px;flex:1}
.nl{
  padding:5px 13px;border-radius:7px;font-size:12px;font-weight:600;
  border:none;cursor:pointer;background:transparent;color:#5a7090;
  transition:all .14s;
}
.nl:hover,.nl.on{color:#f7931a;background:rgba(247,147,26,.1)}
#nav-search{
  display:flex;align-items:center;
  background:#0d1520;border:1px solid #141f2e;
  border-radius:8px;padding:0 11px;height:34px;
  width:250px;gap:7px;flex-shrink:0;
  transition:border-color .14s;
}
#nav-search:focus-within{border-color:rgba(247,147,26,.4)}
#nav-search svg{flex-shrink:0}
#sq{
  background:none;border:none;color:#d8e0ea;
  font-size:12px;flex:1;outline:none;width:100%;
}
#sq::placeholder{color:#3a5068}
#wb{
  margin-left:12px;padding:7px 15px;border-radius:8px;
  background:linear-gradient(135deg,#f7931a,#d4750e);
  border:none;color:#000;font-size:12px;font-weight:800;
  cursor:pointer;white-space:nowrap;flex-shrink:0;
  transition:opacity .14s;box-shadow:0 2px 12px rgba(247,147,26,.3);
}
#wb:hover{opacity:.88}

/* ── STATUS BAR ───────────────────────────────────────────────────────────── */
#sbar{display:none;padding:5px 20px;font-size:11px;font-weight:600;letter-spacing:.2px}

/* ── PAGE ─────────────────────────────────────────────────────────────────── */
#pg{min-height:calc(100vh - 54px)}

/* ── FILTER TABS ──────────────────────────────────────────────────────────── */
.tab{
  padding:4px 13px;border-radius:20px;font-size:11px;font-weight:600;
  cursor:pointer;border:1px solid #141f2e;
  background:rgba(255,255,255,.02);color:#5a7090;
  white-space:nowrap;transition:all .13s;font-family:inherit;
}
.tab.on{border-color:#f7931a;background:rgba(247,147,26,.13);color:#f7931a}
.tab:hover:not(.on){border-color:rgba(247,147,26,.25);color:#b07830}

/* ── CARDS ────────────────────────────────────────────────────────────────── */
.card{
  background:#0d1520;border:1px solid #141f2e;border-radius:12px;
  overflow:hidden;cursor:pointer;
  transition:transform .16s,border-color .18s,box-shadow .18s;
}
.card:hover{
  transform:translateY(-3px);
  border-color:rgba(247,147,26,.4);
  box-shadow:0 10px 32px rgba(247,147,26,.08);
}
.card-media{position:relative;aspect-ratio:1;background:#050810;overflow:hidden}
.card-media iframe{width:100%;height:100%;pointer-events:none}
.card-body{padding:9px 11px 11px}
.card-num{font-size:12px;font-weight:700;color:#d8e0ea;margin-bottom:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-meta{display:flex;justify-content:space-between;font-size:10px;color:#304055}

/* ── GRID ─────────────────────────────────────────────────────────────────── */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(178px,1fr));
  gap:13px;padding:16px 20px;
}

/* ── BADGES ───────────────────────────────────────────────────────────────── */
.badge{
  position:absolute;top:7px;left:7px;
  color:#fff;font-size:9px;font-weight:800;
  padding:2px 6px;border-radius:3px;letter-spacing:.5px;
  pointer-events:none;
}
.rbadge{
  position:absolute;top:7px;right:7px;
  font-size:9px;font-weight:800;
  padding:2px 6px;border-radius:3px;
  pointer-events:none;
}
.colbadge{
  position:absolute;bottom:0;left:0;right:0;
  padding:5px 8px;
  background:linear-gradient(transparent,rgba(5,8,16,.95));
  font-size:10px;font-weight:700;color:#f7931a;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  pointer-events:none;
}

/* ── BUTTONS ──────────────────────────────────────────────────────────────── */
.btn-primary{
  padding:7px 16px;border-radius:8px;font-size:12px;font-weight:700;
  background:linear-gradient(135deg,#f7931a,#d4750e);
  border:none;color:#000;cursor:pointer;
  transition:opacity .14s;font-family:inherit;
}
.btn-primary:hover{opacity:.88}
.btn-ghost{
  padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;
  background:rgba(255,255,255,.03);border:1px solid #1a2535;color:#5a7090;
  cursor:pointer;transition:all .14s;font-family:inherit;text-decoration:none;
  display:inline-flex;align-items:center;gap:5px;
}
.btn-ghost:hover{border-color:rgba(247,147,26,.35);color:#f7931a}
.btn-orange{
  padding:6px 13px;border-radius:7px;font-size:11px;font-weight:700;
  background:rgba(247,147,26,.1);border:1px solid rgba(247,147,26,.3);
  color:#f7931a;cursor:pointer;transition:all .14s;font-family:inherit;
  text-decoration:none;display:inline-block;
}
.btn-orange:hover{background:rgba(247,147,26,.18)}
.load-more{
  padding:10px 28px;background:transparent;
  border:1px solid #1a2535;border-radius:8px;
  color:#5a7090;font-size:13px;font-weight:600;
  cursor:pointer;transition:all .15s;font-family:inherit;
}
.load-more:hover{border-color:rgba(247,147,26,.4);color:#f7931a}

/* ── SURFACE CARDS ────────────────────────────────────────────────────────── */
.surface{
  background:#0d1520;border:1px solid #141f2e;border-radius:12px;
}
.section-label{
  font-size:9px;font-weight:700;color:#304055;
  letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;
}

/* ── META TABLE ───────────────────────────────────────────────────────────── */
.meta-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 16px;font-size:12px;
  border-bottom:1px solid #0e1a28;
}
.meta-row:last-child{border-bottom:none}
.meta-label{color:#5a7090;font-weight:500;flex-shrink:0;margin-right:12px}
.meta-val{color:#d8e0ea;font-weight:600;text-align:right;word-break:break-all;max-width:65%}

/* ── STAT CARD ────────────────────────────────────────────────────────────── */
.stat-card{
  background:#0d1520;border:1px solid #141f2e;border-radius:10px;
  padding:14px 16px;text-align:center;
}
.stat-val{font-size:20px;font-weight:800;color:#f7931a;margin-bottom:3px}
.stat-label{font-size:9px;font-weight:700;color:#304055;letter-spacing:.6px}

/* ── MARKET LINKS ─────────────────────────────────────────────────────────── */
.mlink{
  padding:5px 11px;border-radius:6px;font-size:11px;font-weight:600;
  background:rgba(255,255,255,.02);border:1px solid #141f2e;color:#5a7090;
  text-decoration:none;transition:all .13s;display:inline-block;
}
.mlink:hover{color:#f7931a;border-color:rgba(247,147,26,.3)}

/* ── MODAL ────────────────────────────────────────────────────────────────── */
#modal{
  position:fixed;inset:0;background:rgba(0,0,0,.82);
  display:flex;align-items:center;justify-content:center;
  z-index:200;backdrop-filter:blur(6px);
  animation:fadeIn .18s ease;
}
.modal-box{
  background:#0d1520;border:1px solid #1a2535;border-radius:16px;
  padding:24px;max-width:92vw;
  animation:slideDown .2s ease;
  max-height:90vh;overflow-y:auto;
}

/* ── TOAST ────────────────────────────────────────────────────────────────── */
#tst{position:fixed;bottom:22px;right:22px;z-index:500;pointer-events:none}
.toast-msg{
  background:#0d1520;border:1px solid #f7931a;border-radius:9px;
  padding:11px 16px;color:#f7931a;font-size:12px;font-weight:600;
  pointer-events:auto;animation:fadeUp .2s ease;max-width:320px;
  box-shadow:0 4px 24px rgba(247,147,26,.15);
}

/* ── DETAIL PAGE ──────────────────────────────────────────────────────────── */
.detail-wrap{max-width:1040px;margin:0 auto;padding:24px 20px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}

/* ── BACK BTN ─────────────────────────────────────────────────────────────── */
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:none;border:none;color:#5a7090;
  font-size:12px;font-weight:600;cursor:pointer;
  margin-bottom:22px;padding:0;font-family:inherit;
  transition:color .13s;
}
.back-btn:hover{color:#f7931a}

/* ── HERO STRIP ───────────────────────────────────────────────────────────── */
.hero-strip{
  padding:18px 20px 14px;border-bottom:1px solid #141f2e;
  display:flex;align-items:flex-start;
  justify-content:space-between;flex-wrap:wrap;gap:10px;
}
.hero-title{font-size:19px;font-weight:800;color:#f7931a;letter-spacing:-.3px}
.hero-sub{font-size:11px;color:#304055;margin-top:3px;line-height:1.5}

/* ── FILTER BAR STICKY ────────────────────────────────────────────────────── */
.filter-bar{
  padding:8px 20px;border-bottom:1px solid #141f2e;
  display:flex;gap:5px;overflow-x:auto;
  position:sticky;top:54px;z-index:50;
  background:rgba(7,11,16,.97);
}
.filter-bar::-webkit-scrollbar{height:0}

/* ── SOURCE ROW ───────────────────────────────────────────────────────────── */
.src-row{
  padding:5px 20px;font-size:11px;color:#304055;
  border-bottom:1px solid #141f2e;
  display:flex;align-items:center;gap:6px;
}
.live-dot{
  width:7px;height:7px;border-radius:50%;
  display:inline-block;margin-right:3px;
  animation:pulse 2s ease-in-out infinite;
}

/* ── PIPE DIAGRAM ─────────────────────────────────────────────────────────── */
.pipe-step{
  display:flex;gap:13px;padding:10px 0;
  border-bottom:1px solid #0e1a28;
}
.pipe-step:last-child{border-bottom:none}
.pipe-num{
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;flex-shrink:0;
}

/* ── RUNES ────────────────────────────────────────────────────────────────── */
.rune-card{
  background:#0d1520;border:1px solid #141f2e;border-radius:10px;
  padding:14px 16px;transition:border-color .14s,transform .14s;cursor:pointer;
}
.rune-card:hover{border-color:rgba(247,147,26,.35);transform:translateY(-2px)}

/* ── COLLECTION CARD ──────────────────────────────────────────────────────── */
.col-card{
  background:#0d1520;border:1px solid #141f2e;border-radius:12px;
  overflow:hidden;cursor:pointer;
  transition:transform .16s,border-color .18s;
}
.col-card:hover{transform:translateY(-3px);border-color:rgba(247,147,26,.38)}

/* ── RESPONSIVE ───────────────────────────────────────────────────────────── */
@media(max-width:750px){
  .detail-grid{grid-template-columns:1fr}
  #nav-links .nl:not(#n-home){display:none}
  #nav-search{width:160px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;padding:12px}
  .stats-4{grid-template-columns:repeat(2,1fr)!important}
}
@media(max-width:480px){
  #nav-search{display:none}
  #logo-text{display:none}
}
</style>

  if(s<2592000)return Math.floor(s/86400)+'d ago';
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
};
var tl = function(m){
  if(!m)return'?';if(m.includes('gif'))return'GIF';
  if(m.startsWith('image/'))return'IMG';if(m.startsWith('video/'))return'VID';
  if(m.startsWith('audio/'))return'AUD';if(m==='text/html')return'HTML';
  if(m==='image/svg+xml')return'SVG';if(m.includes('javascript'))return'JS';
  if(m==='text/plain')return'TXT';if(m.includes('gltf')||m.includes('model'))return'3D';
  if(m.includes('markdown'))return'MD';return'FILE';
};
var tc = function(m){
  if(!m)return'#475569';if(m.includes('gif'))return'#f59e0b';
  if(m.startsWith('image/'))return'#3b82f6';if(m.startsWith('video/'))return'#ef4444';
  if(m.startsWith('audio/'))return'#8b5cf6';if(m==='text/html')return'#10b981';
  if(m==='image/svg+xml')return'#ec4899';if(m.includes('javascript'))return'#f59e0b';
  if(m==='text/plain')return'#64748b';return'#475569';
};
var rc = function(r){return{uncommon:'#10b981',rare:'#60a5fa',epic:'#a78bfa',legendary:'#f59e0b',mythic:'#ef4444'}[r]||null};

// ── API ENGINE ───────────────────────────────────────────────────────────────
// Primary: PROXY → ordinals.com (with Accept:application/json)
// Fallback: BestInSlot → Ordiscan → seed data

function apiFetch(url,opts){
  opts=opts||{};
  var c=new AbortController();
  var t=setTimeout(function(){c.abort();},9000);
  return fetch(url,Object.assign({},opts,{
    signal:c.signal,
    headers:Object.assign({'Accept':'application/json'},opts.headers||{})
  })).then(function(r){
    clearTimeout(t);
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).catch(function(e){clearTimeout(t);throw e;});
}

// Normalize ord node JSON response
function nOrd(i){
  if(!i)return null;
  var id=i.id||i.inscription_id||'';
  return{
    id:id,
    number:i.number!=null?i.number:i.inscription_number||0,
    content_type:i.content_type||i.mime_type||'',
    content_length:i.content_length||0,
    genesis_block_height:i.height||i.genesis_block_height||0,
    genesis_timestamp:i.timestamp||i.genesis_timestamp||null,
    sat_rarity:i.rarity||i.sat_rarity||'common',
    sat_name:i.sat_name||i.name||'',
    address:i.address||'',
    value:i.value||546,
    collection_name:i.collection_name||'',collection_slug:'',
    title:i.title||'',
    parent:i.parent||'',
    children:i.children||[],
    preview:ORD+'/preview/'+id,
    content:ORD+'/content/'+id,
    genesis_tx:(id||'').replace(/i\d+$/,''),
    _src:'ord'
  };
}

// Normalize BestInSlot response
function nBIS(i){
  if(!i)return null;
  var id=i.inscription_id||'';
  return{
    id:id,
    number:i.inscription_number!=null?i.inscription_number:0,
    content_type:i.mime_type||'',content_length:i.content_length||0,
    genesis_block_height:i.genesis_height||0,
    genesis_timestamp:i.genesis_ts||null,
    sat_rarity:i.sat_rarity||'common',sat_name:'',
    address:i.owner_wallet_addr||'',value:i.output_value||546,
    collection_name:i.collection_name||'',collection_slug:i.slug||'',
    title:i.inscription_name||'',parent:'',children:[],
    preview:ORD+'/preview/'+id,content:ORD+'/content/'+id,
    genesis_tx:(id||'').replace(/i\d+$/,''),_src:'bis'
  };
}

// Seed fallback items (real IDs, renders via ordinals.com iframes)
function seedItems(off){
  off=off||0;
  return SEEDS.slice(0,24).map(function(id,i){
    return{
      id:id,number:126393671-(off+i)*7,content_type:'',content_length:0,
      genesis_block_height:949146-Math.floor((off+i)/10),
      genesis_timestamp:new Date(Date.now()-(off+i)*90000).toISOString(),
      sat_rarity:'common',sat_name:'',address:'',value:546,
      collection_name:'',collection_slug:'',title:'',parent:'',children:[],
      preview:ORD+'/preview/'+id,content:ORD+'/content/'+id,
      genesis_tx:id.replace(/i\d+$/,''),_seed:true
    };
  });
}

// Fetch inscription feed
function fetchFeed(off,filter){
  var mime={Images:'image/png',GIFs:'image/gif',Text:'text/plain',
    Videos:'video/mp4',Audio:'audio/mpeg',SVGs:'image/svg+xml',
    HTML:'text/html',JS:'application/javascript','3D':'model/gltf-binary',
    Runes:'text/plain'}[filter]||null;

  // Try 1: ordinals.com via proxy (paginated by page number)
  var page=Math.floor(off/20);
  return apiFetch(PROXY+'/inscriptions'+(page>0?'/'+page:'')).then(function(d){
    // ord returns {inscriptions:[...ids...], more:bool, page_index:N}
    var ids=d.inscriptions||[];
    if(!ids.length)throw new Error('empty');
    // Convert bare IDs to minimal items (previews render via ORD iframes)
    var items=ids.slice(0,24).map(function(id,i){
      return{id:id,number:0,content_type:'',content_length:0,
        genesis_block_height:0,genesis_timestamp:null,
        sat_rarity:'common',sat_name:'',address:'',value:546,
        collection_name:'',collection_slug:'',title:'',parent:'',children:[],
        preview:ORD+'/preview/'+id,content:ORD+'/content/'+id,
        genesis_tx:id.replace(/i\d+$/,''),_ord:true};
    });
    return{r:items,src:'ordinals.com (live)',err:null};
  }).catch(function(){
    // Try 2: BestInSlot
    var mq=mime?'&mime_type='+encodeURIComponent(mime):'';
    return apiFetch('https://api.bestinslot.xyz/v3/inscription/all?offset='+off+'&count=24&sort_by=inscr_num&order=desc'+mq).then(function(d){
      var r=(d.data||[]).map(nBIS).filter(Boolean);
      if(!r.length)throw new Error('empty');
      return{r:r,src:'BestInSlot',err:null};
    }).catch(function(){
      // Try 3: Ordiscan
      return apiFetch('https://api.ordiscan.com/v1/inscriptions?page='+(Math.floor(off/24)+1)).then(function(d){
        var r=(d.data||d.results||[]).map(nOrd).filter(Boolean);
        if(!r.length)throw new Error('empty');
        return{r:r,src:'Ordiscan',err:null};
      }).catch(function(){
        // Final: seed data
        return{r:seedItems(off),src:'ordinals.com (seed)',
          err:'APIs unavailable &mdash; showing known inscriptions. Deploy the proxy for live data.'};
      });
    });
  });
}

      if(item&&item.id)return{data:item,src:'BestInSlot'};
      throw new Error('empty');

    });
  });
}

  });

function buildMeta(item){
  var rows=[
    {l:'Inscription #',  v:fn(item.number)},
    {l:'Content Type',   v:item.content_type||'Unknown'},
    {l:'Content Size',   v:fb(item.content_length)},
    {l:'Genesis Block',  v:item.genesis_block_height
      ?'<a href="'+ORD+'/block/'+item.genesis_block_height+'" target="_blank" style="color:#f7931a;text-decoration:none">'+fn(item.genesis_block_height)+' &#8599;</a>'
      :'&mdash;'},
    {l:'Timestamp',      v:item.genesis_timestamp?new Date(item.genesis_timestamp).toUTCString():'&mdash;'},
    {l:'Sat Rarity',     v:item.sat_rarity||'common', rclr:rc(item.sat_rarity)},
    {l:'Sat Name',       v:item.sat_name||'&mdash;'},
    {l:'Value',          v:item.value?fn(item.value)+' sats':'&mdash;'},
    {l:'Parent',         v:item.parent?'<a href="'+ORD+'/inscription/'+item.parent+'" target="_blank" style="color:#f7931a;font-size:10px">'+si(item.parent)+' &#8599;</a>':'&mdash;'},
    {l:'Owner',          v:item.address?'<span style="color:#f7931a;cursor:pointer" onclick="openAddr(\''+item.address+'\')">'+sa(item.address)+'</span>':'&mdash;'},
  ];
  return rows.map(function(r,i){
    return '<div class="meta-row">'
      +'<span class="meta-label">'+r.l+'</span>'
      +'<span class="meta-val" style="'+(r.rclr?'color:'+r.rclr+';':'')+'">'+r.v+'</span>'
      +'</div>';
  }).join('');
}

function cpID(){
  if(ST.sel&&navigator.clipboard)
    navigator.clipboard.writeText(ST.sel.id).then(function(){toast('Inscription ID copied!');});

function loadMeta(id){
  var btn=document.getElementById('load-btn');
  if(btn){btn.innerHTML='<span class="spin">&circledot;</span>&nbsp;Loading&hellip;';btn.disabled=true;}
  fetchOne(id).then(function(res){
    if(res.data){
      ST.sel=Object.assign({},ST.sel,res.data);
      var mb=document.getElementById('meta-box');
      if(mb)mb.innerHTML='<div style="padding:10px 16px;border-bottom:1px solid #0e1a28"><div class="section-label" style="margin:0">Metadata &middot; via '+res.src+'</div></div>'+buildMeta(res.data);
      toast('Full metadata loaded via '+res.src);
    }else{toast('Metadata unavailable &mdash; view on ordinals.com');}
    if(btn)btn.style.display='none';
  });
}

          +'Deploy <code style="background:#0a1018;padding:1px 5px;border-radius:3px;color:#f7931a">proxy-worker.js</code> to Cloudflare Workers, '
          +'then update the <code style="background:#0a1018;padding:1px 5px;border-radius:3px;color:#f7931a">PROXY</code> constant at the top of this file.'

      +'</div>'
      // Data pipeline
      +'<div class="surface" style="padding:20px;margin-bottom:14px">'
        +'<div class="section-label">Data Pipeline</div>'
        +[
          {n:'Bitcoin Blockchain', c:'#f7931a', d:'Inscriptions are stored in Bitcoin transaction witness data (tapscript). Permanent, immutable, on-chain forever.'},
          {n:'ord Node (Rust)',    c:'#f7931a', d:'Casey Rodarmor\'s official indexer. Scans every block, extracts inscriptions, builds a local database. ordinals.com runs this.'},
          {n:'ordinals.com JSON API', c:'#3b82f6', d:'With Accept:application/json header, the ord server returns structured JSON for /inscription/{id}, /inscriptions/{page}, /address/{addr}, /block/{h}, /sat/{n}, /runes and more.'},
          {n:'Cloudflare Worker (Proxy)', c:'#10b981', d:'Our proxy adds the correct header and CORS headers, enabling the browser to fetch live data directly from ordinals.com.'},
          {n:'BestInSlot (Fallback)', c:'#10b981', d:'api.bestinslot.xyz/v3 — third-party indexer with rich metadata. Used when the proxy is unavailable.'},

          {n:'Seed Data (Last Resort)', c:'#475569', d:'24 real inscription IDs scraped from ordinals.com on May 13, 2026. Previews still render via ordinals.com iframes.'},
        ].map(function(s,i){
          return '<div class="pipe-step">'
            +'<div class="pipe-num" style="background:'+s.c+'22;border:1px solid '+s.c+'55;color:'+s.c+'">'+(i+1)+'</div>'
            +'<div><div style="font-size:12px;font-weight:700;color:#d8e0ea;margin-bottom:3px">'+s.n+'</div>'

        }).join('')
      +'</div>'
      // API status
      +'<div class="surface" style="padding:20px">'
        +'<div class="section-label">API Status</div>'
        +[
          {n:'ordinals.com',          dot:'#f7931a', s:'Partial',   note:'preview + content always free &middot; JSON API via proxy'},
          {n:'Cloudflare Proxy',      dot:'#10b981', s:'Deploy',    note:'proxy-worker.js &middot; unlocks full ordinals.com JSON API'},
          {n:'BestInSlot',            dot:'#10b981', s:'Live',      note:'api.bestinslot.xyz/v3 &middot; primary metadata fallback'},
          {n:'Ordiscan',              dot:'#10b981', s:'Live',      note:'api.ordiscan.com/v1 &middot; secondary fallback'},
          {n:'Wallet Native APIs',    dot:'#10b981', s:'Live',      note:'Xverse / UniSat / OKX &middot; active when wallet connected'},
          {n:'Hiro Ordinals API',     dot:'#ef4444', s:'Dead',      note:'Shut down permanently March 9, 2026'},

          +'</div>';
        }).join('')
      +'</div>'
    +'</div>';

  // Load live stats
  apiFetch(PROXY+'/blockheight').then(function(h){
    ST.blockHeight=typeof h==='number'?h:ST.blockHeight;
    return apiFetch('https://api.bestinslot.xyz/v3/inscription/all?offset=0&count=1&sort_by=inscr_num&order=desc');
  }).then(function(d){
    var top=nBIS((d.data||[])[0]);

    if(sc)sc.innerHTML=[
      {v:top?fn(top.number):'126M+',    l:'Total Inscriptions'},
      {v:'Block '+fn(ST.blockHeight),   l:'Latest Block'},
      {v:top?ago(top.genesis_timestamp):'&mdash;',l:'Last Inscription'},
      {v:'3 Active',                    l:'API Providers'},
      {v:'3 Wallets',                   l:'Xverse &middot; UniSat &middot; OKX'},
      {v:'Mar 9, 2026',                 l:'Hiro Shutdown'},

      return '<div class="stat-card"><div class="stat-val">'+c.v+'</div><div class="stat-label">'+c.l+'</div></div>';
    }).join('');
  }).catch(function(){
    var sc=document.getElementById('sc');
    if(sc)sc.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#304055;padding:20px;font-size:12px">Live stats unavailable &mdash; BestInSlot may be rate-limiting.</div>';
  });

  // Test proxy
  apiFetch(PROXY+'/blockheight').then(function(){
    var ps=document.getElementById('proxy-status');
    if(ps)ps.innerHTML='<span style="color:#10b981;font-size:14px">&#10003;</span> <span style="color:#10b981">Proxy connected &mdash; ordinals.com JSON API active</span>';
  }).catch(function(){
    var ps=document.getElementById('proxy-status');
    if(ps)ps.innerHTML='<span style="color:#f59e0b;font-size:14px">&#9888;</span> <span style="color:#f59e0b">Proxy not reachable &mdash; deploy proxy-worker.js to Cloudflare Workers, then update PROXY constant</span>';
  });
}

// ── SAT EXPLORER ──────────────────────────────────────────────────────────────
function openSat(sat){
  setNav(null);sbar(null,null);
  var pg=document.getElementById('pg');pg.className='fade';
  pg.innerHTML=
    '<div class="detail-wrap">'
      +'<button class="back-btn" onclick="renderHome()">'
        +'<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>Back'
      +'</button>'
      +'<div class="hero-title" style="margin-bottom:5px">Satoshi #'+fn(parseInt(sat))+'</div>'
      +'<div class="hero-sub" style="margin-bottom:20px">Sat explorer &middot; via ordinals.com</div>'
      +'<div class="surface" id="sat-box" style="padding:0">'
        +'<div style="padding:20px;border-bottom:1px solid #0e1a28"><div class="section-label" style="margin:0">Loading&hellip;</div></div>'
      +'</div>'
    +'</div>';
  fetchSat(sat).then(function(res){
    sbar(res.src,null);
    var sb=document.getElementById('sat-box');
    if(!res.data||!sb)return;
    var d=res.data;
    var rows=[
      {l:'Sat Number',   v:fn(d.number||sat)},
      {l:'Decimal',      v:d.decimal||'&mdash;'},
      {l:'Degree',       v:d.degree||'&mdash;'},
      {l:'Name',         v:d.name||'&mdash;'},
      {l:'Height',       v:fn(d.height)},
      {l:'Cycle',        v:fn(d.cycle)},
      {l:'Epoch',        v:fn(d.epoch)},
      {l:'Period',       v:fn(d.period)},
      {l:'Offset',       v:fn(d.offset)},
      {l:'Rarity',       v:d.rarity||'common', rclr:rc(d.rarity)},
      {l:'Timestamp',    v:d.timestamp?new Date(d.timestamp*1000).toUTCString():'&mdash;'},
      {l:'Inscriptions', v:fn(d.inscriptions?d.inscriptions.length:0)},
    ];
    sb.innerHTML='<div style="padding:10px 16px;border-bottom:1px solid #0e1a28"><div class="section-label" style="margin:0">Sat Details &middot; via '+res.src+'</div></div>'
      +rows.map(function(r){
        return '<div class="meta-row"><span class="meta-label">'+r.l+'</span><span class="meta-val" style="'+(r.rclr?'color:'+r.rclr+';':'')+'">'+r.v+'</span></div>';
      }).join('');
    if(d.inscriptions&&d.inscriptions.length){
      ST.aux=d.inscriptions.map(function(id){
        return{id:id,number:0,content_type:'',content_length:0,genesis_block_height:0,
          genesis_timestamp:null,sat_rarity:d.rarity||'common',sat_name:d.name||'',
          address:'',value:0,collection_name:'',collection_slug:'',title:'',
          parent:'',children:[],preview:ORD+'/preview/'+id,content:ORD+'/content/'+id,genesis_tx:''};
      });
      sb.innerHTML+='<div style="padding:12px 16px;border-top:1px solid #0e1a28"><div class="section-label">Inscriptions on this Sat</div>'
        +'<div class="grid" style="padding:0">'+ST.aux.map(function(item,i){return cardHTML(item,'openAux('+i+')',i*0.05);}).join('')+'</div>'
      +'</div>';
    }
  });
}

function closeModal(){
  var m=document.getElementById('modal');
  if(m){m.style.display='none';m.innerHTML='';}
}

// No raw unicode in function names — using ASCII equivalents per skill rules
function cXverse(){
  toast('Connecting Xverse\u2026');closeModal();
  setTimeout(function(){
    try{
      var sc=window.SatsConnect;
      if(sc&&sc.getAddress){
        sc.getAddress({
          payload:{purposes:['ordinals','payment'],message:'Connect to ord.xyz',network:{type:'Mainnet'}},
          onFinish:function(r){
            var addrs=(r&&r.addresses)||[];
            var a=null;
            for(var i=0;i<addrs.length;i++){if(addrs[i].purpose==='ordinals'){a=addrs[i];break;}}
            if(!a&&addrs.length)a=addrs[0];
            if(a&&a.address)setWallet('xverse',a.address);
            else toast('Xverse: no address returned');
          },
          onCancel:function(){toast('Xverse: cancelled');}
        });
        return;
      }
      if(window.XverseProviders&&window.XverseProviders.BitcoinProvider){
        window.XverseProviders.BitcoinProvider.request('wallet_connect',null)
          .then(function(res){
            var a=res&&res.result&&res.result.addresses&&res.result.addresses[0];
            if(a)setWallet('xverse',a.address);else toast('Xverse: no address');
          }).catch(function(e){toast('Xverse: '+(e.message||'failed'));});
        return;
      }
      toast('Xverse not installed');
      setTimeout(function(){window.open('https://www.xverse.app/download','_blank');},600);
    }catch(e){toast('Xverse: '+e.message);}
  },200);
}

function cUnisat(){
  toast('Connecting UniSat\u2026');closeModal();
  setTimeout(function(){
    if(!window.unisat){
      toast('UniSat not installed');
      setTimeout(function(){window.open('https://unisat.io/download','_blank');},600);
      return;
    }
    window.unisat.requestAccounts()
      .then(function(a){if(a&&a[0])setWallet('unisat',a[0]);else toast('UniSat: no accounts');})
      .catch(function(e){toast('UniSat: '+(e.message||'failed'));});
  },200);
}

function cOKX(){
  toast('Connecting OKX\u2026');closeModal();
  setTimeout(function(){
    var okx=window.okxwallet&&window.okxwallet.bitcoin;
    if(!okx){
      toast('OKX not installed');
      setTimeout(function(){window.open('https://www.okx.com/web3','_blank');},600);

      .then(function(a){if(a&&a[0])setWallet('okx',a[0]);else toast('OKX: no accounts');})

  },200);
}

function setWallet(type,address){
  ST.wallet={type:type,address:address};
  var wb=document.getElementById('wb');
  if(wb){
    var ico={xverse:'\ud83d\udd35',unisat:'\u26a1',okx:'\u25a0'}[type]||'\ud83d\udcb0';
    wb.textContent=ico+' '+sa(address);
    wb.style.background='rgba(247,147,26,.12)';
    wb.style.border='1px solid rgba(247,147,26,.3)';
    wb.style.color='#f7931a';
    wb.style.boxShadow='none';
    wb.onclick=function(){openAddr(address);};
  }
  toast('\u2713 Connected: '+sa(address));
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
function doSearch(e){
  if(e.key!=='Enter')return;
  var q=(document.getElementById('sq')||{}).value;
  if(!q)return;
  q=q.trim();

  // Bitcoin address
  if(/^(bc1|1|3)/.test(q)&&q.length>20){openAddr(q);return;}

  // Inscription ID (txid + i + index)
  if(/^[0-9a-fA-F]{64}i\d+$/.test(q)){
    var pseudo={id:q,number:0,content_type:'',content_length:0,genesis_block_height:0,
      genesis_timestamp:null,sat_rarity:'common',sat_name:'',address:'',value:546,
      collection_name:'',collection_slug:'',title:'',parent:'',children:[],
      preview:ORD+'/preview/'+q,content:ORD+'/content/'+q,genesis_tx:q.replace(/i\d+$/,'')};
    ST.items=[pseudo];ST.aux=[pseudo];ST.sel=pseudo;
    renderDetail(pseudo);loadMeta(q);
    return;
  }

  // Sat number (very large number)
  if(/^\d+$/.test(q)&&q.length>10){openSat(q);return;}

  // Block height
  if(/^\d+$/.test(q)&&parseInt(q)<=ST.blockHeight){
    go('blocks');
    setTimeout(function(){
      var bi=document.getElementById('blk-in');
      if(bi){bi.value=q;}
      lookupBlkNum(parseInt(q));
    },100);
    return;
  }

  // Inscription number (short number)
  if(/^\d+$/.test(q)){
    toast('Searching inscription #'+fn(parseInt(q))+'\u2026');
    apiFetch('https://api.bestinslot.xyz/v3/inscription/batch_info',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({queries:[parseInt(q)]})
    }).then(function(d){
      var item=nBIS((d.data||[])[0]);
      if(item){ST.items=[item];ST.sel=item;renderDetail(item);}
      else toast('Inscription #'+q+' not found');
    }).catch(function(){toast('Search failed \u2014 try the full inscription ID');});
  }
}
