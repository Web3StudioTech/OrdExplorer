<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>OrdXYZ - Bitcoin Ordinals Explorer</title>
<meta name="description" content="The most fun Bitcoin Ordinals Explorer. Browse inscriptions, collections, blocks, runes and more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0612;
  --bg2:#110d1e;
  --bg3:#1a1430;
  --border:#2a1f4a;
  --border2:#3d2d6b;
  --accent:#f7931a;
  --accent2:#ff6bff;
  --accent3:#00f5ff;
  --accent4:#39ff14;
  --text:#f0e8ff;
  --text2:#9b8ec4;
  --text3:#5a4a80;
  --card:#130e22;
  --card2:#1c1535;
  --radius:14px;
  --font-display:'Bangers',cursive;
  --font-body:'Nunito',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  overflow-x:hidden;
  background-image:
    radial-gradient(ellipse at 20% 20%, rgba(247,147,26,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(255,107,255,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(0,245,255,0.03) 0%, transparent 70%);
}
a{color:inherit;text-decoration:none}
button,input,select{font-family:var(--font-body)}
iframe{border:none;display:block}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ANIMATIONS */
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes wiggle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes glow{0%,100%{text-shadow:0 0 10px var(--accent),0 0 20px var(--accent)}50%{text-shadow:0 0 20px var(--accent),0 0 40px var(--accent),0 0 60px var(--accent)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes rainbow{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(0.8);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}

.fade{animation:fadeUp .3s ease both}
.sk{
  background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 50%,var(--bg2) 75%);
  background-size:200% 100%;
  animation:shimmer 1.5s ease-in-out infinite;
  border-radius:8px;
}
.spin-el{animation:spin .8s linear infinite;display:inline-block}
.float-el{animation:float 3s ease-in-out infinite}
.glow-el{animation:glow 2s ease-in-out infinite}

/* NAV */
#nav{
  position:sticky;top:0;z-index:100;
  height:58px;padding:0 20px;
  background:rgba(10,6,18,0.95);
  border-bottom:2px solid var(--border2);
  display:flex;align-items:center;gap:0;
  backdrop-filter:blur(16px);
  box-shadow:0 2px 30px rgba(247,147,26,0.1);
}
#logo{
  display:flex;align-items:center;gap:10px;
  cursor:pointer;margin-right:20px;flex-shrink:0;
}
#logo-icon{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,#f7931a,#ff6bff);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:900;color:#000;
  box-shadow:0 0 16px rgba(247,147,26,0.5);
  animation:float 3s ease-in-out infinite;
}
#logo-text{
  font-family:var(--font-display);
  font-size:26px;color:var(--accent);
  letter-spacing:1px;
  text-shadow:0 0 12px rgba(247,147,26,0.4);
  line-height:1;
}
#logo-sub{
  font-size:9px;font-weight:800;color:var(--accent2);
  letter-spacing:2px;text-transform:uppercase;
  text-shadow:0 0 8px rgba(255,107,255,0.5);
  margin-top:-2px;
}
#nav-links{display:flex;align-items:center;gap:2px;flex:1;overflow-x:auto}
#nav-links::-webkit-scrollbar{height:0}
.nl{
  padding:5px 12px;border-radius:8px;
  font-size:13px;font-weight:800;
  border:none;cursor:pointer;
  background:transparent;color:var(--text2);
  transition:all .15s;white-space:nowrap;flex-shrink:0;
  letter-spacing:.3px;
}
.nl:hover,.nl.on{
  color:var(--accent);
  background:rgba(247,147,26,0.12);
  text-shadow:0 0 8px rgba(247,147,26,0.4);
}
#nav-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
#nav-search{
  display:flex;align-items:center;
  background:var(--bg2);
  border:1.5px solid var(--border);
  border-radius:10px;padding:0 12px;
  height:36px;width:230px;gap:8px;
  transition:border-color .15s;
}
#nav-search:focus-within{border-color:var(--accent2)}
#sq{
  background:none;border:none;
  color:var(--text);font-size:12px;
  flex:1;outline:none;font-weight:600;
}
#sq::placeholder{color:var(--text3)}
#wb{
  padding:7px 16px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),#ff6bff);
  border:none;color:#000;font-size:12px;font-weight:900;
  cursor:pointer;white-space:nowrap;
  transition:transform .15s,box-shadow .15s;
  box-shadow:0 0 16px rgba(247,147,26,0.4);
  letter-spacing:.5px;
}
#wb:hover{transform:scale(1.05);box-shadow:0 0 24px rgba(247,147,26,0.6)}

/* STATUS BAR */
#sbar{display:none;padding:5px 20px;font-size:11px;font-weight:700;letter-spacing:.3px}
.live-dot{
  width:7px;height:7px;border-radius:50%;
  display:inline-block;margin-right:5px;
  animation:pulse 2s ease-in-out infinite;
}

/* FILTER WRAP */
#filter-wrap{
  background:rgba(10,6,18,0.95);
  border-bottom:2px solid var(--border);
  position:sticky;top:58px;z-index:90;
  backdrop-filter:blur(12px);
}
.fbar-row{
  padding:8px 20px;
  display:flex;gap:5px;overflow-x:auto;
  align-items:center;
}
.fbar-row::-webkit-scrollbar{height:0}

/* TABS */
.tab{
  padding:5px 13px;border-radius:20px;
  font-size:11px;font-weight:800;
  cursor:pointer;border:1.5px solid var(--border);
  background:rgba(255,255,255,0.02);
  color:var(--text2);white-space:nowrap;
  transition:all .15s;font-family:var(--font-body);
  letter-spacing:.3px;
}
.tab.on{
  border-color:var(--accent);
  background:rgba(247,147,26,0.15);
  color:var(--accent);
  box-shadow:0 0 10px rgba(247,147,26,0.2);
}
.tab:hover:not(.on){border-color:var(--border2);color:var(--text)}
.tab-gif.on{border-color:var(--accent2);background:rgba(255,107,255,0.12);color:var(--accent2);box-shadow:0 0 10px rgba(255,107,255,0.2)}
.tab-html.on{border-color:var(--accent3);background:rgba(0,245,255,0.1);color:var(--accent3);box-shadow:0 0 10px rgba(0,245,255,0.2)}
.tab-game.on{border-color:var(--accent4);background:rgba(57,255,20,0.1);color:var(--accent4);box-shadow:0 0 10px rgba(57,255,20,0.2)}
.tab-bitmap.on{border-color:#fbbf24;background:rgba(251,191,36,0.12);color:#fbbf24;box-shadow:0 0 10px rgba(251,191,36,0.2)}
.tab-parent.on{border-color:#a78bfa;background:rgba(167,139,250,0.12);color:#a78bfa}

/* SORT ROW */
.sort-row{
  padding:5px 20px;
  display:flex;align-items:center;gap:6px;
  flex-wrap:wrap;
  border-bottom:1px solid var(--border);
}
.sort-label{
  font-size:9px;font-weight:900;
  color:var(--text3);letter-spacing:1px;
  flex-shrink:0;text-transform:uppercase;
}
.sort-btn{
  padding:3px 10px;border-radius:6px;
  font-size:10px;font-weight:800;
  border:none;cursor:pointer;
  background:transparent;color:var(--text3);
  transition:all .13s;font-family:var(--font-body);
  letter-spacing:.3px;
}
.sort-btn.on{background:var(--accent);color:#000;box-shadow:0 0 8px rgba(247,147,26,0.4)}
.sort-btn:hover:not(.on){color:var(--accent)}
.fdivider{width:1px;height:16px;background:var(--border);flex-shrink:0;margin:0 2px}
.range-in{
  background:var(--bg2);border:1.5px solid var(--border);
  border-radius:6px;padding:3px 9px;
  color:var(--text);font-size:10px;
  width:88px;outline:none;height:26px;
  font-family:var(--font-body);font-weight:700;
  transition:border-color .14s;
}
.range-in:focus{border-color:var(--accent2)}
.go-btn{
  padding:3px 10px;border-radius:6px;
  font-size:10px;font-weight:800;
  border:none;cursor:pointer;
  background:rgba(247,147,26,0.15);
  color:var(--accent);font-family:var(--font-body);
  transition:all .13s;
}
.go-btn:hover{background:rgba(247,147,26,0.25)}

/* SOURCE ROW */
.src-row{
  padding:4px 20px;font-size:11px;
  color:var(--text3);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:6px;
  font-weight:700;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(182px,1fr));
  gap:14px;padding:18px 20px;
}

/* CARD */
.card{
  background:var(--card);
  border:1.5px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;cursor:pointer;
  transition:transform .18s,border-color .18s,box-shadow .18s;
}
.card:hover{
  transform:translateY(-4px) rotate(-0.5deg);
  border-color:var(--accent);
  box-shadow:0 12px 36px rgba(247,147,26,0.15),0 0 0 1px rgba(247,147,26,0.1);
}
.card-media{
  position:relative;aspect-ratio:1;
  background:var(--bg);overflow:hidden;
}
.card-media iframe{width:100%;height:100%;pointer-events:none}
.card-body{padding:9px 11px 11px}
.card-num{
  font-size:12px;font-weight:800;
  color:var(--text);margin-bottom:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.card-meta{
  display:flex;justify-content:space-between;
  font-size:10px;color:var(--text3);font-weight:700;
}

/* BADGES */
.badge{
  position:absolute;top:7px;left:7px;
  color:#000;font-size:9px;font-weight:900;
  padding:2px 7px;border-radius:20px;
  letter-spacing:.5px;pointer-events:none;
  font-family:var(--font-body);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
}
.rbadge{
  position:absolute;top:7px;right:7px;
  font-size:9px;font-weight:900;
  padding:2px 7px;border-radius:20px;
  pointer-events:none;
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
}
.colbadge{
  position:absolute;bottom:0;left:0;right:0;
  padding:6px 9px;
  background:linear-gradient(transparent,rgba(10,6,18,0.97));
  font-size:10px;font-weight:800;color:var(--accent);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  pointer-events:none;letter-spacing:.3px;
}

/* BUTTONS */
.btn-primary{
  padding:9px 20px;border-radius:10px;
  font-size:13px;font-weight:800;
  background:linear-gradient(135deg,var(--accent),#ff6bff);
  border:none;color:#000;cursor:pointer;
  transition:transform .15s,box-shadow .15s;
  font-family:var(--font-body);letter-spacing:.5px;
  box-shadow:0 0 16px rgba(247,147,26,0.3);
}
.btn-primary:hover{transform:scale(1.05);box-shadow:0 0 24px rgba(247,147,26,0.5)}
.btn-ghost{
  padding:7px 14px;border-radius:10px;
  font-size:12px;font-weight:800;
  background:rgba(255,255,255,0.04);
  border:1.5px solid var(--border2);
  color:var(--text2);cursor:pointer;
  transition:all .15s;font-family:var(--font-body);
  text-decoration:none;
  display:inline-flex;align-items:center;gap:5px;
}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:rgba(247,147,26,0.08)}
.btn-orange{
  padding:6px 14px;border-radius:8px;
  font-size:11px;font-weight:800;
  background:rgba(247,147,26,0.12);
  border:1.5px solid rgba(247,147,26,0.35);
  color:var(--accent);cursor:pointer;
  transition:all .15s;font-family:var(--font-body);
  text-decoration:none;display:inline-block;
}
.btn-orange:hover{background:rgba(247,147,26,0.22);box-shadow:0 0 12px rgba(247,147,26,0.3)}
.load-more{
  padding:11px 30px;
  background:var(--bg2);
  border:1.5px solid var(--border2);
  border-radius:12px;
  color:var(--text2);
  font-size:13px;font-weight:800;
  cursor:pointer;transition:all .15s;
  font-family:var(--font-body);letter-spacing:.3px;
}
.load-more:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 0 16px rgba(247,147,26,0.2)}
.mlink{
  padding:5px 12px;border-radius:8px;
  font-size:11px;font-weight:800;
  background:rgba(255,255,255,0.03);
  border:1.5px solid var(--border);
  color:var(--text2);text-decoration:none;
  transition:all .15s;display:inline-block;
}
.mlink:hover{color:var(--accent);border-color:rgba(247,147,26,0.4);background:rgba(247,147,26,0.06)}
.wbtn{
  display:flex;align-items:center;gap:13px;
  width:100%;padding:14px 16px;margin-bottom:9px;
  background:rgba(255,255,255,0.03);
  border:1.5px solid var(--border);
  border-radius:12px;cursor:pointer;
  color:var(--text);font-size:14px;font-weight:800;
  transition:all .15s;text-align:left;
  font-family:var(--font-body);
}
.wbtn:hover{border-color:var(--accent);background:rgba(247,147,26,0.06);transform:translateX(3px)}

/* SURFACE */
.surface{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius)}
.surface2{background:var(--card2);border:1.5px solid var(--border2);border-radius:var(--radius)}
.section-label{
  font-size:9px;font-weight:900;
  color:var(--text3);letter-spacing:1.5px;
  text-transform:uppercase;margin-bottom:10px;
}

/* META TABLE */
.meta-row{
  display:flex;justify-content:space-between;
  align-items:center;padding:9px 16px;
  font-size:12px;border-bottom:1px solid var(--border);
}
.meta-row:last-child{border-bottom:none}
.meta-label{color:var(--text2);font-weight:700;flex-shrink:0;margin-right:12px}
.meta-val{color:var(--text);font-weight:800;text-align:right;word-break:break-all;max-width:65%}

/* STAT CARD */
.stat-card{
  background:var(--card);border:1.5px solid var(--border);
  border-radius:12px;padding:14px 16px;text-align:center;
}
.stat-val{font-size:20px;font-weight:900;color:var(--accent);margin-bottom:3px}
.stat-label{font-size:9px;font-weight:900;color:var(--text3);letter-spacing:.8px}

/* DETAIL */
.detail-wrap{max-width:1060px;margin:0 auto;padding:24px 20px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.back-btn{
  display:inline-flex;align-items:center;gap:7px;
  background:none;border:none;color:var(--text2);
  font-size:12px;font-weight:800;cursor:pointer;
  margin-bottom:22px;padding:0;font-family:var(--font-body);
  transition:color .13s;letter-spacing:.3px;
}
.back-btn:hover{color:var(--accent)}

/* MODAL */
#modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.85);
  display:flex;align-items:center;justify-content:center;
  z-index:200;backdrop-filter:blur(8px);
  animation:fadeIn .18s ease;
}
.modal-box{
  background:var(--card2);
  border:1.5px solid var(--border2);
  border-radius:18px;padding:26px;
  max-width:92vw;
  animation:pop .25s ease;
  max-height:90vh;overflow-y:auto;
}

/* TOAST */
#tst{position:fixed;bottom:22px;right:22px;z-index:500;pointer-events:none}
.toast-msg{
  background:var(--card2);
  border:1.5px solid var(--accent);
  border-radius:12px;padding:12px 18px;
  color:var(--accent);font-size:12px;font-weight:800;
  pointer-events:auto;animation:pop .2s ease;
  max-width:320px;
  box-shadow:0 4px 24px rgba(247,147,26,0.2),0 0 0 1px rgba(247,147,26,0.1);
  letter-spacing:.3px;
}

/* HERO SECTION */
.hero-strip{
  padding:20px 20px 14px;
  border-bottom:2px solid var(--border);
  display:flex;align-items:flex-start;
  justify-content:space-between;flex-wrap:wrap;gap:12px;
  background:linear-gradient(135deg,rgba(247,147,26,0.04) 0%,rgba(255,107,255,0.04) 100%);
}
.hero-title{
  font-family:var(--font-display);
  font-size:32px;color:var(--accent);
  letter-spacing:1px;line-height:1;
  text-shadow:0 0 20px rgba(247,147,26,0.4);
}
.hero-sub{font-size:11px;color:var(--text3);margin-top:5px;line-height:1.6;font-weight:700}

/* TRENDING */
.trend-btn{
  padding:4px 10px;border-radius:6px;
  font-size:10px;font-weight:900;
  border:none;cursor:pointer;
  background:transparent;color:var(--text3);
  transition:all .13s;font-family:var(--font-body);
  letter-spacing:.5px;
}
.trend-btn.on{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#000;box-shadow:0 0 10px rgba(247,147,26,0.4);
}

/* COLLECTION CARD */
.col-card{
  background:var(--card);border:1.5px solid var(--border);
  border-radius:var(--radius);overflow:hidden;cursor:pointer;
  transition:transform .18s,border-color .18s,box-shadow .18s;
}
.col-card:hover{
  transform:translateY(-5px) rotate(0.5deg);
  border-color:var(--accent2);
  box-shadow:0 14px 40px rgba(255,107,255,0.15);
}

/* RUNE CARD */
.rune-card{
  background:var(--card);border:1.5px solid var(--border);
  border-radius:12px;padding:15px 16px;
  cursor:pointer;transition:all .16s;
}
.rune-card:hover{border-color:var(--accent3);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,245,255,0.1)}

/* PIPE STEP */
.pipe-step{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--border)}
.pipe-step:last-child{border-bottom:none}
.pipe-num{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;flex-shrink:0;
  font-family:var(--font-display);letter-spacing:.5px;
}

/* NO RESULTS */
.no-results{
  grid-column:1/-1;text-align:center;
  color:var(--text3);padding:60px 20px;font-size:14px;font-weight:700;
}
.no-results a{color:var(--accent)}

/* BITMAP PREVIEW */
.bitmap-preview{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:6px;
  background:linear-gradient(135deg,#0a0612,#1a0d00);
}
.bitmap-num{
  font-family:var(--font-display);
  font-size:28px;color:#fbbf24;
  text-shadow:0 0 20px rgba(251,191,36,0.6);
}
.bitmap-lbl{font-size:9px;font-weight:900;color:#92681a;letter-spacing:2px}

/* EMOJI DECORATIONS */
.deco{
  position:fixed;pointer-events:none;
  font-size:24px;opacity:0.06;z-index:0;
  animation:float 6s ease-in-out infinite;
}

/* RESPONSIVE */
@media(max-width:750px){
  .detail-grid{grid-template-columns:1fr}
  .stats-4{grid-template-columns:repeat(2,1fr)!important}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:12px}
  #logo-text{font-size:20px}
  #nav-links .nl:nth-child(n+5){display:none}
  #nav-search{width:160px}
}
@media(max-width:500px){
  #logo-sub{display:none}
  #nav-search{display:none}
  .hero-title{font-size:24px}
}
</style>
</head>
<body>

<!-- Decorative floating emojis -->
<div class="deco" style="top:10%;left:5%;animation-delay:0s">&#8383;</div>

function ago(ts){
  if(!ts)return'&mdash;';
  var d=new Date(typeof ts==='number'?ts>1e12?ts:ts*1000:ts);
  var s=Math.floor((Date.now()-d)/1000);
  if(s<60)return s+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  if(s<2592000)return Math.floor(s/86400)+'d ago';
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

// ── API FETCH ─────────────────────────────────────────────────────────────────
function apiFetch(url,opts){
  opts=opts||{};
  var c=new AbortController();
  var t=setTimeout(function(){c.abort();},10000);
  return fetch(url,Object.assign({},opts,{signal:c.signal,headers:Object.assign({'Accept':'application/json'},opts.headers||{})}))
    .then(function(r){clearTimeout(t);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .catch(function(e){clearTimeout(t);throw e;});
}

function bisSortParam(){
  if(ST.sort==='oldest')return'&sort_by=inscr_num&order=asc';
  if(ST.sort==='rare')return'&sort_by=sat_rarity&order=desc';
  return'&sort_by=inscr_num&order=desc';
}
function bisRangeParam(){
  var p='';
  if(ST.rangeFrom)p+='&from_number='+encodeURIComponent(ST.rangeFrom);
  if(ST.rangeTo)p+='&to_number='+encodeURIComponent(ST.rangeTo);
  return p;
}

function fetchFeed(off,ct){
  var CT=getCT(ct);
  var mimes=CT.mime||null;

  if(ct==='bitmap'){
    return apiFetch(BIS+'/bitmap/all?offset='+off+'&count=24&order='+(ST.sort==='oldest'?'asc':'desc'))
      .then(function(d){
        var r=(d.data||[]).map(function(b){
          var id=b.inscription_id||'';
          return{id:id,number:b.inscription_number||0,content_type:'text/plain',
            content_length:0,genesis_block_height:b.genesis_height||0,genesis_timestamp:b.genesis_ts||null,
            sat_rarity:b.sat_rarity||'common',sat_name:'',address:b.owner_wallet_addr||'',
            value:546,collection_name:'',collection_slug:'',title:b.bitmap_number!=null?b.bitmap_number+'.bitmap':'',
            parent:'',children:[],preview:ORD+'/preview/'+id,content:ORD+'/content/'+id,
            genesis_tx:(id||'').replace(/i\d+$/,''),_bitmap:b.bitmap_number,_src:'bis'};
        }).filter(Boolean);
        if(r.length)return{r:r,src:'BestInSlot (Bitmap)',err:null};
        throw new Error('empty');
      }).catch(function(){return seedFallback(off);});
  }
  if(ct==='parent'){
    return apiFetch(BIS+'/inscription/all?offset='+off+'&count=24&has_children=true'+bisSortParam()+bisRangeParam())
      .then(function(d){
        var r=(d.data||[]).map(nBIS).filter(Boolean);
        if(r.length)return{r:r,src:'BestInSlot (Parents)',err:null};
        throw new Error('empty');
      }).catch(function(){return seedFallback(off);});
  }
  if(ct==='game'){
    return apiFetch(BIS+'/inscription/all?offset='+off+'&count=24&mime_type=text%2Fhtml'+bisSortParam())
      .then(function(d){
        var r=(d.data||[]).map(nBIS).filter(Boolean);
        if(r.length)return{r:r,src:'BestInSlot (HTML/Games)',err:null};
        throw new Error('empty');
      }).catch(function(){return seedFallback(off);});
  }

  var proxyPage=Math.floor(off/20);
  return apiFetch(PROXY+'/inscriptions'+(proxyPage>0?'/'+proxyPage:''))
    .then(function(d){
      var ids=d.inscriptions||[];
      if(!ids.length)throw new Error('empty');
      var r=ids.slice(0,24).map(function(id){
        return{id:id,number:0,content_type:'',content_length:0,genesis_block_height:0,
          genesis_timestamp:null,sat_rarity:'common',sat_name:'',address:'',value:546,
          collection_name:'',collection_slug:'',title:'',parent:'',children:[],
          preview:ORD+'/preview/'+id,content:ORD+'/content/'+id,
          genesis_tx:id.replace(/i\d+$/,''),_ord:true};
      });
      return{r:r,src:'ordinals.com',err:null};
    }).catch(function(){
      var mq=mimes?('&mime_type='+encodeURIComponent(mimes.split(',')[0])):'';
      return apiFetch(BIS+'/inscription/all?offset='+off+'&count=24'+bisSortParam()+mq+bisRangeParam())
        .then(function(d){
          var r=(d.data||[]).map(nBIS).filter(Boolean);
          if(r.length)return{r:r,src:'BestInSlot',err:null};
          throw new Error('empty');
        }).catch(function(){
          return apiFetch(ORDSCAN+'/inscriptions?page='+(Math.floor(off/24)+1))
            .then(function(d){
              var r=(d.data||d.results||[]).map(nOrd).filter(Boolean);
              if(r.length)return{r:r,src:'Ordiscan',err:null};
              throw new Error('empty');
            }).catch(function(){return seedFallback(off);});
        });
    });
}

function seedFallback(off){
  var r=SEEDS.slice(0,24).map(function(id,i){
    return{id:id,number:126393671-(off+i)*7,content_type:'',content_length:0,
      genesis_block_height:949146-Math.floor((off+i)/10),
      genesis_timestamp:new Date(Date.now()-(off+i)*90000).toISOString(),
      sat_rarity:'common',sat_name:'',address:'',value:546,
      collection_name:'',collection_slug:'',title:'',parent:'',children:[],
      preview:ORD+'/preview/'+id,content:ORD+'/content/'+id,
      genesis_tx:id.replace(/i\d+$/,''),_seed:true};
  });
  return{r:r,src:'ordinals.com (seed)',err:'APIs unavailable &mdash; showing known inscriptions. Deploy proxy for live data.'};
}

        throw new Error('empty');
      }).catch(function(){return fetchAddrAPI(addr);});
    }
    if(ST.wallet.type==='okx'&&window.okxwallet&&window.okxwallet.bitcoin&&window.okxwallet.bitcoin.getInscriptions){
      return window.okxwallet.bitcoin.getInscriptions(0,100).then(function(res){
        var list=(res&&res.list)||[];
        if(list.length)return{r:list.map(function(i){return mkWI(i.inscriptionId,i.inscriptionNumber,i.collectionName,addr);}),src:'OKX Wallet'};
        throw new Error('empty');
      }).catch(function(){return fetchAddrAPI(addr);});
    }
    if(ST.wallet.type==='xverse'){
      var sc=window.SatsConnect;
      if(sc&&sc.request){
        return sc.request('ord_getInscriptions',{limit:100,offset:0}).then(function(res){
          if(res&&res.status==='success'){
            var ins=(res.result&&res.result.inscriptions)||[];
            if(ins.length)return{r:ins.map(function(i){return mkWI(i.inscriptionId,i.inscriptionNumber,i.collectionName,addr);}),src:'Xverse Wallet'};
          }
          throw new Error('empty');
        }).catch(function(){return fetchAddrAPI(addr);});
      }
    }
  }
  return fetchAddrAPI(addr);
}

// ── COLLECTIONS DATA ENGINE ───────────────────────────────────────────────────
function loadCollections(onDone){
  if(ST.COL_LOADED&&ST.COL_CACHE.length){onDone(ST.COL_CACHE);return;}
  fetch('./collections.json').then(function(r){if(!r.ok)throw new Error('no file');return r.json();})
    .then(function(d){
      var list=d.collections||d;
      if(!Array.isArray(list)||!list.length)throw new Error('empty');
      ST.COL_CACHE=list;ST.COL_LOADED=true;ST.COL_HAS_MORE=false;
      ST.COL_SOURCE='collections.json (local backup &mdash; '+list.length.toLocaleString()+' collections)';
      onDone(ST.COL_CACHE);
    }).catch(function(){
      ST.COL_SOURCE='BestInSlot (live)';
      fetchBISCols(0,onDone);
    });
}
function fetchBISCols(offset,onDone){
  if(ST.COL_LOADING)return;
  ST.COL_LOADING=true;
  apiFetch(BIS+'/collection/collections?sort_by=median_number&order=asc&offset='+offset+'&count=100')
    .then(function(d){
      var items=(d.data||[]).map(normBISCol).filter(Boolean);
      ST.COL_CACHE=ST.COL_CACHE.concat(items);
      ST.COL_OFFSET=offset+items.length;
      ST.COL_HAS_MORE=items.length>=100;
      ST.COL_LOADING=false;
      if(onDone)onDone(ST.COL_CACHE);
    }).catch(function(){
      ST.COL_LOADING=false;
      if(onDone)onDone(ST.COL_CACHE);
    });
}
function loadMoreBISCols(onDone){
  if(!ST.COL_HAS_MORE||ST.COL_LOADING){if(onDone)onDone([]);return;}
  fetchBISCols(ST.COL_OFFSET,onDone);
}

  if(isBitmap){

    mediaInner='<iframe src="'+preview+'" sandbox="allow-scripts allow-same-origin" loading="lazy" style="width:100%;height:100%" title="'+label+'"></iframe>';
  }else{
    mediaInner='<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--border2);font-size:32px">&#9974;</div>';

    +(item.collection_name?'<div class="colbadge">'+item.collection_name+'</div>':'')
    +'</div>'
    +'<div class="card-body">'
    +'<div class="card-num">'+label+'</div>'
    +'<div class="card-meta"><span>'+ago(item.genesis_timestamp)+'</span><span>Blk '+fn(item.genesis_block_height)+'</span></div>'

function loadFeed(reset){
  if(ST.loading)return;ST.loading=true;
  var off=reset?0:ST.off;
  if(reset){ST.items=[];ST.off=0;ST.hasMore=true;}
  var cg=document.getElementById('cg'),lmw=document.getElementById('lmw');
  if(cg&&reset)cg.innerHTML=skCards();if(lmw)lmw.innerHTML='';
  fetchFeed(off,ST.contentType).then(function(res){
    ST.items=reset?res.r:ST.items.concat(res.r);
    ST.off=ST.items.length;ST.hasMore=res.r.length>=20;ST.src=res.src;
    sbar(res.err?null:res.src,res.err);
    var st=document.getElementById('src-txt');
    if(st)st.innerHTML=res.err?'&#9888; APIs unavailable &mdash; seed inscriptions shown':fn(ST.items.length)+' inscriptions &middot; via '+res.src;
    if(cg){
      if(reset)cg.innerHTML='';
      var base=ST.items.length-res.r.length;
      cg.innerHTML+=res.r.map(function(item,i){return cardHTML(item,'openIns('+(base+i)+')',i*0.022);}).join('');
    }
    if(lmw&&ST.hasMore)lmw.innerHTML='<button class="load-more" onclick="loadFeed(false)">&#9660; Load More</button>';
    ST.loading=false;
  });
}

  });
}

function closeModal(){var m=document.getElementById('modal');if(m){m.style.display='none';m.innerHTML='';}}

function cXverse(){
  toast('&#128309; Connecting Xverse\u2026');closeModal();
  setTimeout(function(){
    try{
      var sc=window.SatsConnect;
      if(sc&&sc.getAddress){
        sc.getAddress({
          payload:{purposes:['ordinals','payment'],message:'Connect to OrdXYZ',network:{type:'Mainnet'}},
          onFinish:function(r){
            var addrs=(r&&r.addresses)||[];
            var a=null;
            for(var i=0;i<addrs.length;i++){if(addrs[i].purpose==='ordinals'){a=addrs[i];break;}}
            if(!a&&addrs.length)a=addrs[0];
            if(a&&a.address)setWallet('xverse',a.address);
            else toast('&#128561; Xverse: no address returned');
          },
          onCancel:function(){toast('Xverse: cancelled');}
        });return;
      }
      if(window.XverseProviders&&window.XverseProviders.BitcoinProvider){
        window.XverseProviders.BitcoinProvider.request('wallet_connect',null)
          .then(function(res){var a=res&&res.result&&res.result.addresses&&res.result.addresses[0];if(a)setWallet('xverse',a.address);else toast('&#128561; Xverse: no address');})
          .catch(function(e){toast('Xverse: '+e.message);});return;
      }
      toast('Xverse not installed');
      setTimeout(function(){window.open('https://www.xverse.app/download','_blank');},600);
    }catch(e){toast('Xverse: '+e.message);}
  },200);
}
function cUnisat(){
  toast('&#9889; Connecting UniSat\u2026');closeModal();
  setTimeout(function(){
    if(!window.unisat){toast('UniSat not installed');setTimeout(function(){window.open('https://unisat.io/download','_blank');},600);return;}
    window.unisat.requestAccounts()
      .then(function(a){if(a&&a[0])setWallet('unisat',a[0]);else toast('&#128561; UniSat: no accounts');})
      .catch(function(e){toast('UniSat: '+e.message);});
  },200);
}
function cOKX(){
  toast('&#9632; Connecting OKX\u2026');closeModal();
  setTimeout(function(){
    var okx=window.okxwallet&&window.okxwallet.bitcoin;
    if(!okx){toast('OKX not installed');setTimeout(function(){window.open('https://www.okx.com/web3','_blank');},600);return;}
    okx.requestAccounts()
      .then(function(a){if(a&&a[0])setWallet('okx',a[0]);else toast('&#128561; OKX: no accounts');})
      .catch(function(e){toast('OKX: '+e.message);});
  },200);
}
function setWallet(type,address){
  ST.wallet={type:type,address:address};
  var wb=document.getElementById('wb');
  if(wb){
    var ico={xverse:'&#128309;',unisat:'&#9889;',okx:'&#9632;'}[type]||'&#128081;';
    wb.innerHTML=ico+' '+sa(address);
    wb.style.background='rgba(247,147,26,0.12)';
    wb.style.border='1.5px solid rgba(247,147,26,0.35)';
    wb.style.color='var(--accent)';
    wb.style.boxShadow='0 0 12px rgba(247,147,26,0.2)';
    wb.onclick=function(){openAddr(address);};
  }
  toast('&#10024; Connected: '+sa(address));
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
function doSearch(e){
  if(e.key!=='Enter')return;
  var q=(document.getElementById('sq')||{}).value;
  if(!q)return;q=q.trim();
  if(/^(bc1|1|3)/.test(q)&&q.length>20){openAddr(q);return;}
  if(/^[0-9a-fA-F]{64}i\d+$/.test(q)){
    var p={id:q,number:0,content_type:'',content_length:0,genesis_block_height:0,
      genesis_timestamp:null,sat_rarity:'common',sat_name:'',address:'',value:546,
      collection_name:'',collection_slug:'',title:'',parent:'',children:[],
      preview:ORD+'/preview/'+q,content:ORD+'/content/'+q,genesis_tx:q.replace(/i\d+$/,'')};
    ST.items=[p];ST.aux=[p];ST.sel=p;renderDetail(p);loadMeta(q);return;
  }
  if(/^\d+$/.test(q)&&q.length>10){lookupSat(q);return;}
  if(/^\d+$/.test(q)&&parseInt(q)<=ST.blockH+10&&parseInt(q)>800000){
    go('blocks');
    setTimeout(function(){var bi=document.getElementById('blk-in');if(bi)bi.value=q;lookupBlkNum(parseInt(q));},150);
    return;
  }
  if(/^\d+$/.test(q)){
    toast('&#128269; Searching inscription #'+fn(parseInt(q))+'\u2026');
    apiFetch(BIS+'/inscription/batch_info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({queries:[parseInt(q)]})})
      .then(function(d){
        var item=nBIS((d.data||[])[0]);
        if(item){ST.items=[item];ST.sel=item;renderDetail(item);}
        else toast('&#128561; Inscription #'+q+' not found');
      }).catch(function(){toast('&#128561; Search failed &mdash; try the full inscription ID');});
  }
}

  try{var p=new URLSearchParams(window.location.search);var ct=p.get('content-type');if(ct)ST.contentType=ct;}catch(e){}
}
