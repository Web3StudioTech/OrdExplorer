<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="Bitcoin Ordinals Explorer — Browse inscriptions, collections, blocks, runes and more.">
<meta name="theme-color" content="#070b10">
<title>ord.xyz &mdash; Bitcoin Ordinals Explorer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#070b10;color:#d8e0ea;font-family:'Inter',system-ui,-apple-system,sans-serif;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select{font-family:inherit}
iframe{border:none;display:block}

@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

.sk{background:linear-gradient(90deg,#0d1520 25%,#1a2535 50%,#0d1520 75%);background-size:200% 100%;animation:shimmer 1.5s ease-in-out infinite;border-radius:6px}
.fade{animation:fadeUp .28s ease both}
.spin-el{animation:spin .8s linear infinite;display:inline-block}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#070b10}
::-webkit-scrollbar-thumb{background:#1a2535;border-radius:3px}

/* NAV */
#nav{position:sticky;top:0;z-index:100;height:54px;padding:0 20px;background:rgba(7,11,16,.97);border-bottom:1px solid #141f2e;display:flex;align-items:center;gap:0;backdrop-filter:blur(12px)}
#logo{display:flex;align-items:center;gap:9px;cursor:pointer;margin-right:22px;flex-shrink:0}
#logo-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#f7931a,#d4750e);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:#000;box-shadow:0 2px 12px rgba(247,147,26,.35)}
#logo-text{font-size:16px;font-weight:800;color:#f7931a;letter-spacing:-.4px}
#nav-links{display:flex;align-items:center;gap:1px;flex:1;overflow-x:auto}
#nav-links::-webkit-scrollbar{height:0}
.nl{padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;border:none;cursor:pointer;background:transparent;color:#5a7090;transition:all .14s;white-space:nowrap;flex-shrink:0}
.nl:hover,.nl.on{color:#f7931a;background:rgba(247,147,26,.1)}
#nav-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
#nav-search{display:flex;align-items:center;background:#0d1520;border:1px solid #141f2e;border-radius:8px;padding:0 11px;height:34px;width:240px;gap:7px;transition:border-color .14s}
#nav-search:focus-within{border-color:rgba(247,147,26,.4)}
#sq{background:none;border:none;color:#d8e0ea;font-size:12px;flex:1;outline:none;width:100%}
#sq::placeholder{color:#3a5068}
#wb{padding:7px 15px;border-radius:8px;background:linear-gradient(135deg,#f7931a,#d4750e);border:none;color:#000;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;transition:opacity .14s;box-shadow:0 2px 12px rgba(247,147,26,.3)}
#wb:hover{opacity:.88}

/* STATUS */
#sbar{display:none;padding:5px 20px;font-size:11px;font-weight:600;letter-spacing:.2px}
.live-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px;animation:pulse 2s ease-in-out infinite}

/* FILTER BAR */
#filter-wrap{background:rgba(7,11,16,.97);border-bottom:1px solid #141f2e;position:sticky;top:54px;z-index:90;backdrop-filter:blur(12px)}
.fbar-row{padding:7px 20px;display:flex;gap:5px;overflow-x:auto;align-items:center}
.fbar-row::-webkit-scrollbar{height:0}
.tab{padding:4px 12px;border-radius:18px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid #141f2e;background:rgba(255,255,255,.02);color:#5a7090;white-space:nowrap;transition:all .13s;font-family:inherit}
.tab.on{border-color:#f7931a;background:rgba(247,147,26,.13);color:#f7931a}
.tab:hover:not(.on){border-color:rgba(247,147,26,.25);color:#b07830}
.tab-special{border-color:rgba(167,139,250,.3);color:#a78bfa;background:rgba(167,139,250,.07)}
.tab-special:hover{border-color:rgba(167,139,250,.5)}
.tab-special.on{border-color:#a78bfa;background:rgba(167,139,250,.18);color:#a78bfa}
.tab-bitmap{border-color:rgba(251,191,36,.3);color:#fbbf24;background:rgba(251,191,36,.07)}
.tab-bitmap.on{border-color:#fbbf24;background:rgba(251,191,36,.18);color:#fbbf24}
.tab-game{border-color:rgba(34,197,94,.3);color:#22c55e;background:rgba(34,197,94,.07)}
.tab-game.on{border-color:#22c55e;background:rgba(34,197,94,.18);color:#22c55e}
.fdivider{width:1px;height:18px;background:#141f2e;flex-shrink:0;margin:0 3px}

/* SORT / FILTER ROW */
.sort-row{padding:5px 20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid #0e1a28}
.sort-label{font-size:10px;font-weight:700;color:#304055;letter-spacing:.5px;flex-shrink:0}
.sort-btn{padding:3px 9px;border-radius:5px;font-size:10px;font-weight:700;border:none;cursor:pointer;background:transparent;color:#304055;transition:all .13s;font-family:inherit}
.sort-btn.on{background:#f7931a;color:#000}
.sort-btn:hover:not(.on){color:#f7931a}
.range-input{background:#0d1520;border:1px solid #141f2e;border-radius:6px;padding:3px 9px;color:#d8e0ea;font-size:10px;width:90px;outline:none;height:26px;transition:border-color .14s}
.range-input:focus{border-color:rgba(247,147,26,.4)}
.go-btn{padding:3px 9px;border-radius:5px;font-size:10px;font-weight:700;border:none;cursor:pointer;background:rgba(247,147,26,.15);color:#f7931a;font-family:inherit;transition:all .13s}
.go-btn:hover{background:rgba(247,147,26,.25)}

/* SOURCE ROW */
.src-row{padding:4px 20px;font-size:11px;color:#304055;border-bottom:1px solid #0e1a28;display:flex;align-items:center;gap:6px}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:13px;padding:16px 20px}

/* CARD */
.card{background:#0d1520;border:1px solid #141f2e;border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .16s,border-color .18s,box-shadow .18s}
.card:hover{transform:translateY(-3px);border-color:rgba(247,147,26,.4);box-shadow:0 10px 32px rgba(247,147,26,.08)}
.card-media{position:relative;aspect-ratio:1;background:#050810;overflow:hidden}
.card-media iframe{width:100%;height:100%;pointer-events:none}
.card-body{padding:9px 11px 11px}
.card-num{font-size:12px;font-weight:700;color:#d8e0ea;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-meta{display:flex;justify-content:space-between;font-size:10px;color:#304055}
.badge{position:absolute;top:7px;left:7px;color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:3px;letter-spacing:.5px;pointer-events:none}
.rbadge{position:absolute;top:7px;right:7px;font-size:9px;font-weight:800;padding:2px 6px;border-radius:3px;pointer-events:none}
.colbadge{position:absolute;bottom:0;left:0;right:0;padding:5px 8px;background:linear-gradient(transparent,rgba(5,8,16,.95));font-size:10px;font-weight:700;color:#f7931a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none}
.bitmap-badge{position:absolute;bottom:7px;right:7px;background:rgba(251,191,36,.2);color:#fbbf24;font-size:9px;font-weight:800;padding:2px 6px;border-radius:3px;pointer-events:none}

/* SURFACES */
.surface{background:#0d1520;border:1px solid #141f2e;border-radius:12px}
.section-label{font-size:9px;font-weight:700;color:#304055;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.meta-row{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;font-size:12px;border-bottom:1px solid #0e1a28}
.meta-row:last-child{border-bottom:none}
.meta-label{color:#5a7090;font-weight:500;flex-shrink:0;margin-right:12px}
.meta-val{color:#d8e0ea;font-weight:600;text-align:right;word-break:break-all;max-width:65%}
.stat-card{background:#0d1520;border:1px solid #141f2e;border-radius:10px;padding:14px 16px;text-align:center}
.stat-val{font-size:20px;font-weight:800;color:#f7931a;margin-bottom:3px}
.stat-label{font-size:9px;font-weight:700;color:#304055;letter-spacing:.6px}

/* BUTTONS */
.btn-primary{padding:7px 16px;border-radius:8px;font-size:12px;font-weight:700;background:linear-gradient(135deg,#f7931a,#d4750e);border:none;color:#000;cursor:pointer;transition:opacity .14s;font-family:inherit}
.btn-primary:hover{opacity:.88}
.btn-ghost{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;background:rgba(255,255,255,.03);border:1px solid #1a2535;color:#5a7090;cursor:pointer;transition:all .14s;font-family:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.btn-ghost:hover{border-color:rgba(247,147,26,.35);color:#f7931a}
.btn-orange{padding:6px 13px;border-radius:7px;font-size:11px;font-weight:700;background:rgba(247,147,26,.1);border:1px solid rgba(247,147,26,.3);color:#f7931a;cursor:pointer;transition:all .14s;font-family:inherit;text-decoration:none;display:inline-block}
.btn-orange:hover{background:rgba(247,147,26,.18)}
.load-more{padding:10px 28px;background:transparent;border:1px solid #1a2535;border-radius:8px;color:#5a7090;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
.load-more:hover{border-color:rgba(247,147,26,.4);color:#f7931a}
.mlink{padding:5px 11px;border-radius:6px;font-size:11px;font-weight:600;background:rgba(255,255,255,.02);border:1px solid #141f2e;color:#5a7090;text-decoration:none;transition:all .13s;display:inline-block}
.mlink:hover{color:#f7931a;border-color:rgba(247,147,26,.3)}
.wbtn{display:flex;align-items:center;gap:12px;width:100%;padding:13px 15px;margin-bottom:8px;background:rgba(255,255,255,.02);border:1px solid #141f2e;border-radius:10px;cursor:pointer;color:#d8e0ea;font-size:14px;font-weight:600;transition:all .14s;text-align:left;font-family:inherit}
.wbtn:hover{border-color:rgba(247,147,26,.35);background:rgba(247,147,26,.04)}

/* DETAIL */
.detail-wrap{max-width:1060px;margin:0 auto;padding:24px 20px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:#5a7090;font-size:12px;font-weight:600;cursor:pointer;margin-bottom:22px;padding:0;font-family:inherit;transition:color .13s}
.back-btn:hover{color:#f7931a}
.pipe-step{display:flex;gap:13px;padding:10px 0;border-bottom:1px solid #0e1a28}
.pipe-step:last-child{border-bottom:none}
.pipe-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}

/* MODAL */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(6px);animation:fadeIn .18s ease}
.modal-box{background:#0d1520;border:1px solid #1a2535;border-radius:16px;padding:24px;max-width:92vw;animation:slideDown .2s ease;max-height:90vh;overflow-y:auto}

/* TOAST */
#tst{position:fixed;bottom:22px;right:22px;z-index:500;pointer-events:none}
.toast-msg{background:#0d1520;border:1px solid #f7931a;border-radius:9px;padding:11px 16px;color:#f7931a;font-size:12px;font-weight:600;pointer-events:auto;animation:fadeUp .2s ease;max-width:320px;box-shadow:0 4px 24px rgba(247,147,26,.15)}

/* CONTENT TYPE ICONS */
.ct-video{background:#ef4444}
.ct-image{background:#3b82f6}
.ct-gif{background:#f59e0b}
.ct-text{background:#64748b}
.ct-audio{background:#8b5cf6}
.ct-svg{background:#ec4899}
.ct-html{background:#10b981}
.ct-js{background:#f59e0b}
.ct-3d{background:#06b6d4}
.ct-md{background:#84cc16}
.ct-bitmap{background:#fbbf24}
.ct-game{background:#22c55e}
.ct-parent{background:#a78bfa}
.ct-file{background:#475569}

/* BITMAP SPECIAL */
.bitmap-preview{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;background:linear-gradient(135deg,#0a0f18,#111824)}
.bitmap-num{font-size:22px;font-weight:900;color:#fbbf24;letter-spacing:-.5px}
.bitmap-label{font-size:10px;font-weight:700;color:#92681a;letter-spacing:1px}

/* GAME SPECIAL */
.game-preview{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;background:linear-gradient(135deg,#051208,#0a1f12)}
.game-icon{font-size:36px}
.game-label{font-size:9px;font-weight:700;color:#16a34a;letter-spacing:1px}

/* NO RESULTS */
.no-results{grid-column:1/-1;text-align:center;color:#304055;padding:60px 20px;font-size:14px}
.no-results a{color:#f7931a}

/* RESPONSIVE */
@media(max-width:750px){.detail-grid{grid-template-columns:1fr}.stats-4{grid-template-columns:repeat(2,1fr)!important}#nav-links .nl:nth-child(n+5){display:none}#nav-search{width:160px}}
@media(max-width:500px){#logo-text{display:none}#nav-search{display:none}}
</style>
</head>

var fn  = function(n){return n!=null?Number(n).toLocaleString():'&mdash;'};
var fb  = function(n){if(!n)return'&mdash;';if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(2)+' MB'};
var sa  = function(a){return a?a.slice(0,8)+'\u2026'+a.slice(-5):'&mdash;'};
var si  = function(a){return a?a.slice(0,12)+'\u2026'+a.slice(-4):'&mdash;'};
var ago = function(ts){
  if(!ts)return'&mdash;';
  var d=new Date(typeof ts==='number'?ts>1e12?ts:ts*1000:ts);
  var s=Math.floor((Date.now()-d)/1000);
  if(s<60)return s+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';
  if(s<86400)return Math.floor(s/3600)+'h ago';
  if(s<2592000)return Math.floor(s/86400)+'d ago';
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
};

// Get content type definition by id
function getCT(id){
  for(var i=0;i<CONTENT_TYPES.length;i++){if(CONTENT_TYPES[i].id===id)return CONTENT_TYPES[i];}
  return CONTENT_TYPES[0];
}

// Type label & color from mime
var tl = function(m){
  if(!m)return'?';
  if(m.includes('gif'))return'GIF';if(m.startsWith('image/'))return'IMG';
  if(m.startsWith('video/'))return'VID';if(m.startsWith('audio/'))return'AUD';
  if(m==='text/html')return'HTML';if(m==='image/svg+xml')return'SVG';
  if(m.includes('javascript'))return'JS';if(m==='text/plain')return'TXT';
  if(m.includes('gltf')||m.includes('model'))return'3D';
  if(m.includes('markdown'))return'MD';return'FILE';
};
var tc = function(m){
  if(!m)return'#475569';if(m.includes('gif'))return'#f59e0b';
  if(m.startsWith('image/'))return'#3b82f6';if(m.startsWith('video/'))return'#ef4444';
  if(m.startsWith('audio/'))return'#8b5cf6';if(m==='text/html')return'#10b981';
  if(m==='image/svg+xml')return'#ec4899';if(m.includes('javascript'))return'#f59e0b';
  if(m==='text/plain')return'#64748b';if(m.includes('model'))return'#06b6d4';

};

// ── API FETCH ────────────────────────────────────────────────────────────────
function apiFetch(url,opts){
  opts=opts||{};
  var c=new AbortController();
  var t=setTimeout(function(){c.abort();},9000);
  return fetch(url,Object.assign({},opts,{signal:c.signal,headers:Object.assign({'Accept':'application/json'},opts.headers||{})}))
    .then(function(r){clearTimeout(t);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .catch(function(e){clearTimeout(t);throw e;});
}

// Build BIS query params from current state
function bisSortParam(){
  if(ST.sort==='oldest')return'&sort_by=inscr_num&order=asc';
  if(ST.sort==='highest')return'&sort_by=inscr_num&order=desc';
  if(ST.sort==='lowest')return'&sort_by=inscr_num&order=asc';
  if(ST.sort==='rare')return'&sort_by=sat_rarity&order=desc';
  return'&sort_by=inscr_num&order=desc'; // newest default
}

function bisRangeParam(){
  var p='';
  if(ST.rangeFrom)p+='&from_number='+encodeURIComponent(ST.rangeFrom);
  if(ST.rangeTo)p+='&to_number='+encodeURIComponent(ST.rangeTo);
  return p;
}

function fetchFeed(off,ct){
  var CT=getCT(ct);
  var mimes=CT.mime||null;

  // Special: Bitmap — BIS has dedicated bitmap endpoint
  if(ct==='bitmap'){
    return apiFetch(BIS+'/bitmap/all?offset='+off+'&count=24&order='+(ST.sort==='oldest'?'asc':'desc')).then(function(d){
      var r=(d.data||[]).map(function(b){
        return{id:b.inscription_id||'',number:b.inscription_number||0,
          content_type:'text/plain',content_length:0,
          genesis_block_height:b.genesis_height||0,genesis_timestamp:b.genesis_ts||null,
          sat_rarity:b.sat_rarity||'common',sat_name:'',address:b.owner_wallet_addr||'',
          value:546,collection_name:'',collection_slug:'',
          title:b.bitmap_number!=null?b.bitmap_number+'.bitmap':'',
          parent:'',children:[],
          preview:ORD+'/preview/'+(b.inscription_id||''),
          content:ORD+'/content/'+(b.inscription_id||''),
          genesis_tx:(b.inscription_id||'').replace(/i\d+$/,''),
          _bitmap:b.bitmap_number,_src:'bis'};
      }).filter(Boolean);
      if(r.length)return{r:r,src:'BestInSlot (Bitmap)',err:null};
      throw new Error('empty');
    }).catch(function(){return seedFallback(off,ct);});
  }

  // Special: Parents — inscriptions that have children
  if(ct==='parent'){
    return apiFetch(BIS+'/inscription/all?offset='+off+'&count=24&has_children=true'+bisSortParam()+bisRangeParam()).then(function(d){
      var r=(d.data||[]).map(nBIS).filter(Boolean);
      if(r.length)return{r:r,src:'BestInSlot (Parents)',err:null};
      throw new Error('empty');
    }).catch(function(){return seedFallback(off,ct);});
  }

  // Special: Games — HTML inscriptions tagged as games by BIS
  if(ct==='game'){
    return apiFetch(BIS+'/inscription/all?offset='+off+'&count=24&mime_type=text%2Fhtml&is_game=true'+bisSortParam()).then(function(d){
      var r=(d.data||[]).map(nBIS).filter(Boolean);
      if(r.length)return{r:r,src:'BestInSlot (Games)',err:null};
      throw new Error('empty');
    }).catch(function(){
      // Fallback: just HTML
      return apiFetch(BIS+'/inscription/all?offset='+off+'&count=24&mime_type=text%2Fhtml'+bisSortParam()).then(function(d){
        var r=(d.data||[]).map(nBIS).filter(Boolean);
        if(r.length)return{r:r,src:'BestInSlot (HTML/Games)',err:null};
        throw new Error('empty');
      }).catch(function(){return seedFallback(off,ct);});
    });
  }

  // Standard: proxy → BIS → Ordiscan → seed
  var proxyPath='/inscriptions'+(ST.sort==='oldest'?'/0':''+(Math.floor(off/20)>0?'/'+Math.floor(off/20):''));
  return apiFetch(PROXY+proxyPath).then(function(d){
    var ids=d.inscriptions||[];
    if(!ids.length)throw new Error('empty');
    var r=ids.slice(0,24).map(function(id){
      return{id:id,number:0,content_type:'',content_length:0,genesis_block_height:0,
        genesis_timestamp:null,sat_rarity:'common',sat_name:'',address:'',value:546,
        collection_name:'',collection_slug:'',title:'',parent:'',children:[],
        preview:ORD+'/preview/'+id,content:ORD+'/content/'+id,
        genesis_tx:id.replace(/i\d+$/,''),_ord:true};
    });
    return{r:r,src:'ordinals.com (proxy)',err:null};
  }).catch(function(){
    // BIS fallback
    var mq=mimes?('&mime_type='+encodeURIComponent(mimes.split(',')[0])):'';
    return apiFetch(BIS+'/inscription/all?offset='+off+'&count=24'+bisSortParam()+mq+bisRangeParam()).then(function(d){
      var r=(d.data||[]).map(nBIS).filter(Boolean);
      if(r.length)return{r:r,src:'BestInSlot',err:null};
      throw new Error('empty');
    }).catch(function(){
      return apiFetch(ORDSCAN+'/inscriptions?page='+(Math.floor(off/24)+1)).then(function(d){
        var r=(d.data||d.results||[]).map(nOrd).filter(Boolean);
        if(r.length)return{r:r,src:'Ordiscan',err:null};
        throw new Error('empty');
      }).catch(function(){return seedFallback(off,ct);});
    });
  });
}

      genesis_block_height:949146-Math.floor((off+i)/10),
      genesis_timestamp:new Date(Date.now()-(off+i)*90000).toISOString(),

        throw new Error('empty');
      }).catch(function(){return fetchAddrAPI(addr);});
    }

        throw new Error('empty');
      }).catch(function(){return fetchAddrAPI(addr);});
    }
    if(ST.wallet.type==='xverse'){
      var sc=window.SatsConnect;
      if(sc&&sc.request){
        return sc.request('ord_getInscriptions',{limit:100,offset:0}).then(function(res){
          if(res&&res.status==='success'){

}

// ── CARD ─────────────────────────────────────────────────────────────────────
function cardHTML(item,onclick,delay){
  delay=delay||0;
  var rclr=rc(item.sat_rarity);
  var preview=item.preview||ORD+'/preview/'+(item.id||'');
  var isBitmap=item._bitmap!=null;
  var label=isBitmap?(item._bitmap+'.bitmap'):(item.title||('#'+fn(item.number)));

  var mediaInner;
  if(isBitmap){
    // Bitmap: show number.bitmap display instead of iframe (they're just text)
    mediaInner='<div class="bitmap-preview">'
      +'<div class="bitmap-num">'+item._bitmap+'</div>'
      +'<div class="bitmap-label">.BITMAP</div>'
      +'</div>';
  } else if(preview){
    mediaInner='<iframe src="'+preview+'" sandbox="allow-scripts allow-same-origin" loading="lazy" style="width:100%;height:100%" title="'+label+'"></iframe>';
  } else {
    mediaInner='<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#1a2535;font-size:32px">&#8982;</div>';
  }

  return '<div class="card fade" onclick="'+onclick+'" style="animation-delay:'+delay.toFixed(2)+'s">'
    +'<div class="card-media">'
    +mediaInner
    +'<span class="badge" style="background:'+(isBitmap?'#fbbf24':tc(item.content_type))+'">'+
      (isBitmap?'BMP':tl(item.content_type))+'</span>'
    +(rclr?'<span class="rbadge" style="background:'+rclr+'22;color:'+rclr+'">'+(item.sat_rarity||'').slice(0,3).toUpperCase()+'</span>':'')
    +(item.sat_name?'<span class="bitmap-badge">'+item.sat_name+'</span>':'')
    +(item.collection_name?'<div class="colbadge">'+item.collection_name+'</div>':'')
    +'</div>'
    +'<div class="card-body">'
    +'<div class="card-num">'+label+'</div>'
    +'<div class="card-meta"><span>'+ago(item.genesis_timestamp)+'</span><span>Blk '+fn(item.genesis_block_height)+'</span></div>'
    +'</div>'
    +'</div>';
}

function skCard(){
  return'<div class="card" style="cursor:default">'
    +'<div class="card-media sk"></div>'
    +'<div class="card-body">'
    +'<div class="sk" style="height:12px;width:55%;margin-bottom:7px"></div>'
    +'<div class="sk" style="height:10px;width:75%"></div>'

function loadFeed(reset){
  if(ST.loading)return;ST.loading=true;
  var off=reset?0:ST.off;
  if(reset){ST.items=[];ST.off=0;ST.hasMore=true;}
  var cg=document.getElementById('cg'),lmw=document.getElementById('lmw');
  if(cg&&reset)cg.innerHTML=skCards();if(lmw)lmw.innerHTML='';
  fetchFeed(off,ST.contentType).then(function(res){
    ST.items=reset?res.r:ST.items.concat(res.r);
    ST.off=ST.items.length;ST.hasMore=res.r.length>=20;ST.src=res.src;
    sbar(res.err?null:res.src,res.err);
    var st=document.getElementById('src-txt');
    if(st)st.innerHTML=res.err?'APIs unavailable \u2014 showing seed inscriptions':fn(ST.items.length)+' inscriptions \u00b7 via '+res.src;
    if(cg){
      if(reset)cg.innerHTML='';
      var base=ST.items.length-res.r.length;
      cg.innerHTML+=res.r.map(function(item,i){return cardHTML(item,'openIns('+(base+i)+')',i*0.022);}).join('');
    }
    if(lmw&&ST.hasMore)lmw.innerHTML='<button class="load-more" onclick="loadFeed()">Load More</button>';
    ST.loading=false;
  });
}

    {l:'Value',v:item.value?fn(item.value)+' sats':'&mdash;'},

// ── COLLECTIONS DATA ENGINE ─────────────────────────────────────────────────
// Priority: 1) collections.json (local backup)  2) BestInSlot live  3) hardcoded

var COL_CACHE = [];        // all collections loaded in memory
var COL_LOADED = false;    // have we loaded the full list yet?
var COL_OFFSET = 0;        // BIS pagination offset
var COL_HAS_MORE = true;   // more pages available on BIS
var COL_LOADING = false;   // currently fetching
var COL_SOURCE = null;     // where data came from

// Load collections — tries local JSON first, then BIS live
function loadCollections(onDone){
  if(COL_LOADED && COL_CACHE.length){onDone(COL_CACHE);return;}

  // Try local collections.json backup first
  fetch('./collections.json').then(function(r){
    if(!r.ok)throw new Error('no file');
    return r.json();
  }).then(function(d){
    var list=d.collections||d;
    if(!Array.isArray(list)||!list.length)throw new Error('empty');
    COL_CACHE=list;COL_LOADED=true;COL_HAS_MORE=false;
    COL_SOURCE='collections.json (local backup &middot; '+list.length.toLocaleString()+' collections)';
    onDone(COL_CACHE);
  }).catch(function(){
    // No local file — fetch from BestInSlot live
    COL_SOURCE='BestInSlot (live)';
    fetchBISCollections(0,onDone);
  });
}

// Fetch one page (100) from BestInSlot
function fetchBISCollections(offset,onDone){
  if(COL_LOADING)return;
  COL_LOADING=true;
  var url=BIS+'/collection/collections?sort_by=median_number&order=asc&offset='+offset+'&count=100';
  apiFetch(url).then(function(d){
    var items=d.data||[];
    var normalized=items.map(normBISCol).filter(Boolean);
    COL_CACHE=COL_CACHE.concat(normalized);
    COL_OFFSET=offset+items.length;
    COL_HAS_MORE=items.length>=100;
    COL_LOADING=false;
    if(onDone)onDone(COL_CACHE);
  }).catch(function(){
    COL_LOADING=false;
    // Return whatever we have so far (or empty)
    if(onDone)onDone(COL_CACHE);
  });
}

// Load NEXT page from BestInSlot (for "Load More" button)
function loadMoreBISCollections(onDone){
  if(!COL_HAS_MORE||COL_LOADING){if(onDone)onDone([]);return;}
  fetchBISCollections(COL_OFFSET,onDone);
}

// Normalize BestInSlot collection response
function normBISCol(c){
  if(!c||!c.slug)return null;
  return{
    slug:c.slug,
    name:c.name||c.slug,
    supply:parseInt(c.supply)||0,
    min_number:c.min_number||0,
    max_number:c.max_number||0,
    median_number:c.median_number||0,
    icon:c.icon_url||c.inscription_icon_id||'',
    bis_url:c.bis_url||('https://bestinslot.xyz/ordinals/collection/'+(c.slug||'')),
    floor_price:c.floor_price||null,
    vol_24h:c.vol_24h_in_btc||null,
    vol_7d:c.vol_7d_in_btc||null,
    vol_total:c.vol_total_in_btc||null,
    sale_cnt_total:c.sale_cnt_total||null,
    listed:c.listed_count||null,
  };
}

// Filter collections by search query
function filterCollections(list,q){
  if(!q)return list;
  q=q.toLowerCase();
  return list.filter(function(c){
    return (c.name||'').toLowerCase().includes(q)||(c.slug||'').toLowerCase().includes(q);
  });
}

// Format floor price from sats
function fmtFloor(sats){
  if(!sats)return'&mdash;';
  var btc=(sats/100000000).toFixed(4);
  return btc+' BTC';
}
function fmtVol(btc){
  if(!btc)return'&mdash;';
  return parseFloat(btc).toFixed(2)+' BTC';
}

    var idx=fullList.indexOf(c);

    return '<div class="card" onclick="openCollection(''+c.slug+'',''+c.name+'')" style="padding:0;overflow:hidden;animation:fadeUp .22s ease '+(Math.min(i,20)*0.025).toFixed(2)+'s both">'

          +'</div>'
          +'<div style="flex:1;min-width:0">'
            +'<div style="font-size:13px;font-weight:800;color:#d8e0ea;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+c.name+'</div>'
            +'<div style="font-size:10px;color:#3a5068;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+c.slug+'</div>'

function loadMoreCols(){

  loadMoreBISCollections(function(){
    renderCollections();
  });
}



function openCollection(slug,name){
  if(!slug){toast('Collection slug not available');return;}
  setNav(null);sbar(null,null);
  var pg=document.getElementById('pg');pg.className='fade';
  pg.innerHTML=
    '<div style="max-width:1060px;margin:0 auto;padding:24px 20px">'
      +'<button class="back-btn" onclick="renderCollections()">'
        +'<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>Collections'
      +'</button>'
      +'<div style="font-size:19px;font-weight:800;color:#f7931a;margin-bottom:5px">'+name+'</div>'
      +'<div style="font-size:11px;color:#304055;margin-bottom:18px">Fetching via BestInSlot &middot; slug: '+slug+'</div>'
      +'<div class="grid" id="col-grid">'+skCards(12)+'</div>'
    +'</div>';
  fetchCollection(slug).then(function(res){
    ST.aux=res.r;sbar(res.src,null);
    var cg=document.getElementById('col-grid');
    if(cg)cg.innerHTML=res.r.length
      ?res.r.map(function(item,i){return cardHTML(item,'openAux('+i+')',i*0.022);}).join('')
      :'<div class="no-results">No inscriptions returned.<br><br><a href="https://ordinalswallet.com/collection/'+slug+'" target="_blank">View on Ordinals Wallet &#8599;</a></div>';
  });
}
